<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/icon-180.png">
<title>Bravo Mike SimMonitor</title>
<link rel="stylesheet" href="css/base.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
  h1 { font-size: clamp(28px, 6vw, 44px); margin: 0; }
  p { color: var(--muted); margin: 0; line-height: 1.5; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  a.opt { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; color: var(--text); text-decoration: none; }
  a.opt b { font-size: 20px; }
  a.opt span { color: var(--muted); font-size: 14px; line-height: 1.4; }
  a.opt:hover { border-color: var(--brand); }
  a.opt .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; }
  .ic svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mode { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandmark" style="justify-content:center;font-size:22px"><span class="bm">BM</span><span>SimMonitor</span></div>
  <h1>Simulador de monitor</h1>
  <p>Abra o <b>monitor</b> no notebook ou tablet e o <b>controle</b> no celular do instrutor.</p>
  <div class="opts">
    <a class="opt" href="monitor.html"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4M6 11h3l1.5-3 3 6 1.5-3h3"/></svg></div><b>Monitor</b><span>Notebook, TV ou tablet. Mostra o QR code para conectar o controle.</span></a>
    <a class="opt" href="controle.html"><div class="ic"><svg viewBox="0 0 24 24"><path d="M7 2h10v20H7zM11 18h2"/></svg></div><b>Controle</b><span>Celular do instrutor. Digite o código da sala ou leia o QR code.</span></a>
  </div>
  <div class="mode" id="mode"></div>
</div>
<script type="module">
  import { detectMode } from './js/transport.js';
  detectMode().then(({ mode }) => {
    document.getElementById('mode').textContent = { local: 'Modo local — funcionando sem internet pelo Wi-Fi', online: 'Modo online', demo: 'Modo demonstração — monitor e controle no mesmo aparelho' }[mode];
  });
</script>
</body>
</html>
