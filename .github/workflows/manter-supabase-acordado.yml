# Consulta leve ao banco a cada 3 dias para o Supabase gratuito não hibernar.
# A consulta é recusada de propósito (a chave pública não lê a tabela, código
# 42501). A recusa vem do próprio banco, então conta como uso. Nada é lido ou
# gravado. Se falhar, o GitHub avisa por e-mail: aí o projeto já hibernou e é
# preciso religar no painel do Supabase.
name: Manter Supabase acordado
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consulta leve ao banco
        env:
          SUPABASE_URL: https://vonehbabrbjbjfxnsmpj.supabase.co
          SUPABASE_KEY: sb_publishable_LOxS8a6PH_rVENRC8N29Wg_CPiFo09L
        run: |
          codigo=$(curl -sS -o resposta.txt -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/sim_salas?select=id&limit=1") || codigo=000
          echo "HTTP $codigo"; head -c 300 resposta.txt || true; echo
          if [ "$codigo" = "200" ] || grep -q '"42501"' resposta.txt; then
            echo "Banco respondeu. Projeto acordado."
          else
            echo "::error::Supabase não respondeu (HTTP $codigo). Confira se o projeto está pausado."
            exit 1
          fi
